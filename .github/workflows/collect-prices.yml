name: Collect Stock Prices

# A-share trading hours are 09:30-15:00 Beijing time (UTC+8). Intraday runs
# every 30 minutes take one full-market snapshot; the 15:10 run switches to
# "close" mode, which always re-fetches and overwrites today's row with the
# final closing price. GitHub cron is best-effort, so runs can be delayed.
#
# Throughput: the snapshot path is a single upstream call for the whole market
# and fits comfortably in the 25-minute job limit. If that endpoint is down,
# the collector falls back to per-stock daily bars, sharded across runs with a
# cursor stored in system_settings (PRICE_BATCH_SIZE stocks per shard).
on:
  schedule:
    - cron: "30 1 * * 1-5"  # 09:30 CST
    - cron: "0 2 * * 1-5"   # 10:00 CST
    - cron: "30 2 * * 1-5"  # 10:30 CST
    - cron: "0 3 * * 1-5"   # 11:00 CST
    - cron: "30 3 * * 1-5"  # 11:30 CST
    # lunch break 11:30-13:00 CST — no runs
    - cron: "0 5 * * 1-5"   # 13:00 CST
    - cron: "30 5 * * 1-5"  # 13:30 CST
    - cron: "0 6 * * 1-5"   # 14:00 CST
    - cron: "30 6 * * 1-5"  # 14:30 CST
    - cron: "10 7 * * 1-5"  # 15:10 CST — closing prices
    - cron: "40 7 * * 1-5"  # 15:40 CST — closing-price retry
  workflow_dispatch:
    inputs:
      mode:
        description: "auto = snapshot intraday / close after 15:05; backfill = ~10 years per stock (sharded)"
        type: choice
        options:
          - auto
          - close
          - snapshot
          - backfill
        default: auto
      batch_size:
        description: "Stocks per shard for history/backfill modes"
        required: false
        default: "600"

permissions:
  contents: read

concurrency:
  group: collect-prices
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: python-collector/requirements.txt

      - run: pip install -r python-collector/requirements.txt

      - name: Run price collector
        working-directory: python-collector
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_D1_DATABASE_ID: ${{ secrets.CLOUDFLARE_D1_DATABASE_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          TABLE_PREFIX: ${{ vars.TABLE_PREFIX }}
          PRICE_MODE: ${{ github.event.inputs.mode || 'auto' }}
          PRICE_BATCH_SIZE: ${{ github.event.inputs.batch_size || '600' }}
        run: python collect_prices.py
