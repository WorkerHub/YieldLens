name: Collect Stock Prices

# A-share trading hours are 09:30-15:00 Beijing time (UTC+8). Four runs a day
# take one full-market snapshot each; the 15:10 run switches to "close" mode,
# which always re-fetches and overwrites today's row with the final closing
# price. The cadence is deliberately capped at four runs: each snapshot writes
# ~11k rows, and the D1 free plan allows 100k rows written per day (account
# wide, shared with the dividend job). GitHub cron is best-effort, so runs can
# be delayed.
#
# Throughput: the snapshot path is a single upstream call for the whole market
# and fits comfortably in the 25-minute job limit. If that endpoint is down,
# the collector falls back to per-stock daily bars, sharded across runs with a
# cursor stored in system_settings (PRICE_BATCH_SIZE stocks per shard).
on:
  # schedule:
  #   - cron: "0 2 * * 1-5"   # 10:00 CST
  #   - cron: "30 3 * * 1-5"  # 11:30 CST
  #   - cron: "0 6 * * 1-5"   # 14:00 CST
  #   - cron: "10 7 * * 1-5"  # 15:10 CST — closing prices
  workflow_dispatch:
    inputs:
      mode:
        description: "auto = snapshot intraday / close after 15:05; backfill = ~10 years per stock (sharded)"
        type: choice
        options:
          - auto
          - close
          - snapshot
          - history
          - backfill
        default: auto
      batch_size:
        description: "Stocks per shard (blank = 600 for history, 30 for backfill)"
        required: false

permissions:
  contents: read

concurrency:
  group: collect-prices
  cancel-in-progress: false

jobs:
  # The repository is public: contributor-controlled events (a pull_request in
  # particular) must never reach the team's machine. The collector job below is
  # skipped for them; this GitHub-hosted job turns the run red with an explicit
  # message instead of leaving it silently skipped.
  reject-untrusted:
    if: github.event_name != 'schedule' && github.event_name != 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Refuse untrusted event
        run: |
          echo "::error::Refusing to run the self-hosted collector for event '${{ github.event_name }}'; only schedule and workflow_dispatch are allowed."
          exit 1

  collect:
    # This job runs on the team's own machine (P3685.local), where the upstream
    # sites are reachable. Only trusted events may reach that runner: `schedule`
    # always runs the default branch's workflow, and `workflow_dispatch`
    # requires write access. The condition is evaluated before a runner is
    # assigned, so untrusted code never executes on it.
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: [self-hosted, yieldlens]
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      # actions/setup-python hardcodes /Users/runner/hostedtoolcache on macOS
      # (v5 through v7), a path a self-hosted runner running as a normal user
      # cannot create. uv manages its own CPython 3.11 under ~/.local/share/uv
      # and caches wheels in ~/.cache/uv, so repeat runs stay fast.
      - name: Set up Python 3.11
        run: |
          command -v uv >/dev/null || { echo "::error::uv is required on the self-hosted runner (install: curl -LsSf https://astral.sh/uv/install.sh | sh)"; exit 1; }
          uv venv --python 3.11 .venv
          echo "$PWD/.venv/bin" >> "$GITHUB_PATH"
          uv pip install --python .venv/bin/python -r python-collector/requirements.txt

      - name: Run price collector
        working-directory: python-collector
        env:
          # Organization-level shared configuration (inherited by this repo).
          # D1_DATABASE_ID is the org variable name; the collector expects the
          # CLOUDFLARE_* environment names below.
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_D1_DATABASE_ID: ${{ vars.D1_DATABASE_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          # Fixed per-project prefix on the shared D1 database. Keep it in sync
          # with worker/wrangler.toml [vars] TABLE_PREFIX.
          TABLE_PREFIX: "YL"
          PRICE_MODE: ${{ github.event.inputs.mode || 'auto' }}
          PRICE_BATCH_SIZE: ${{ github.event.inputs.batch_size || (github.event.inputs.mode == 'backfill' && '30' || '600') }}
        run: python collect_prices.py
