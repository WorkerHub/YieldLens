name: Apply D1 Schema

# Manually apply the pending ledger-backed migrations to the organization's
# shared D1 database. The migration manifest is the ordered list in
# python-collector/common/migrations.py; today it holds one entry, schema_v1,
# whose content is worker/src/db/schema.sql unchanged.
#
# Each unrecorded migration is applied one statement per request and recorded in
# this prefix's ledger table (prefix YL -> _YL_schema_migrations) only after all
# of its statements succeeded and the shape check passed. The run stops at the
# first failing statement (that migration stays unrecorded, later ones are not
# attempted, the job exits non-zero), and migrations already in the ledger are
# skipped without sending any SQL. The first ledger-based run against an
# existing database simply stamps schema_v1: its DDL is all CREATE ... IF NOT
# EXISTS, so it no-ops on the existing tables and leaves the data alone.
# Sample data (worker/seed.sql) is never applied here.
#
# Credentials come from organization-level variables/secrets, not from
# wrangler.toml placeholders. The collector talks to the D1 HTTP API directly.
on:
  workflow_dispatch:
    inputs:
      prefix:
        description: "Table prefix (default YL; YL and YL_ both mean YL_)"
        required: false
        default: "YL"
      dry_run:
        description: "Print the generated statements without sending them to D1"
        type: boolean
        required: false
        default: false

permissions:
  contents: read

concurrency:
  group: apply-schema
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: python-collector/requirements.txt

      - run: pip install -r python-collector/requirements.txt

      - name: Apply schema to shared D1
        working-directory: python-collector
        env:
          # Organization-level shared configuration (inherited by this repo).
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_D1_DATABASE_ID: ${{ vars.D1_DATABASE_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          TABLE_PREFIX: ${{ github.event.inputs.prefix || 'YL' }}
        run: |
          python tools/apply_schema.py --prefix "$TABLE_PREFIX" ${{ github.event.inputs.dry_run == 'true' && '--dry-run' || '' }}
