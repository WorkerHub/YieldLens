name: Collect Dividends and Fundamentals

# Runs once daily after the A-share close. "daily" mode covers the three most
# recently disclosed report periods; "backfill" mode covers ~10 years and is
# only started manually from the Actions tab.
on:
  schedule:
    - cron: "0 8 * * 1-5"   # 16:00 CST, weekdays
    - cron: "0 8 * * 6,0"   # also run weekends to catch weekend announcements
  workflow_dispatch:
    inputs:
      mode:
        description: "daily = last 3 disclosed periods; backfill = first full history load"
        type: choice
        options:
          - daily
          - backfill
        default: daily
      backfill_periods:
        description: "Only for backfill mode: number of report periods (20 = ~10 years)"
        required: false
        default: "20"

permissions:
  contents: read

concurrency:
  group: collect-dividends
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: python-collector/requirements.txt

      - run: pip install -r python-collector/requirements.txt

      - name: Run dividend + fundamentals collector
        working-directory: python-collector
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_D1_DATABASE_ID: ${{ secrets.CLOUDFLARE_D1_DATABASE_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          TABLE_PREFIX: ${{ vars.TABLE_PREFIX }}
          COLLECT_MODE: ${{ github.event.inputs.mode || 'daily' }}
          BACKFILL_PERIODS: ${{ github.event.inputs.backfill_periods || '20' }}
        run: python collect_dividends.py
