name: Collect Dividends and Fundamentals

# Runs once daily after A-share market close. Dividend announcements change
# rarely (see PRD.md section 3 "更新频率"), so daily batch collection is
# sufficient — no need to match the price collector's intraday frequency.
on:
  schedule:
    - cron: "0 8 * * 1-5"   # 16:00 CST, weekdays
    - cron: "0 8 * * 6,0"   # also run weekends to catch weekend announcements
  workflow_dispatch:
    inputs:
      backfill_periods:
        description: "Number of historical report periods to backfill (each period is one bulk API call covering the whole market). Default 1 for incremental daily runs; use ~20 for the initial 10-year backfill."
        required: false
        default: "1"

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: python-collector/requirements.txt

      - run: pip install -r python-collector/requirements.txt

      - name: Run dividend + fundamentals collector
        working-directory: python-collector
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_D1_DATABASE_ID: ${{ secrets.CLOUDFLARE_D1_DATABASE_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          TABLE_PREFIX: ${{ vars.TABLE_PREFIX }}
          BACKFILL_PERIODS: ${{ github.event.inputs.backfill_periods || '1' }}
        run: python collect_dividends.py
