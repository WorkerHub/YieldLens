name: Collect Dividends and Fundamentals

# Runs once daily after the A-share close. "daily" mode covers the three most
# recently disclosed report periods; "backfill" mode covers ~10 years and is
# only started manually from the Actions tab.
on:
  schedule:
    - cron: "0 8 * * 1-5"   # 16:00 CST, weekdays
    - cron: "0 8 * * 6,0"   # also run weekends to catch weekend announcements
  workflow_dispatch:
    inputs:
      mode:
        description: "daily = last 3 disclosed periods; backfill = first full history load"
        type: choice
        options:
          - daily
          - backfill
        default: daily
      backfill_periods:
        description: "Only for backfill mode: number of report periods (20 = ~10 years)"
        required: false
        default: "20"

permissions:
  contents: read

concurrency:
  group: collect-dividends
  cancel-in-progress: false

jobs:
  # The repository is public: contributor-controlled events (a pull_request in
  # particular) must never reach the team's machine. The collector job below is
  # skipped for them; this GitHub-hosted job turns the run red with an explicit
  # message instead of leaving it silently skipped.
  reject-untrusted:
    if: github.event_name != 'schedule' && github.event_name != 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Refuse untrusted event
        run: |
          echo "::error::Refusing to run the self-hosted collector for event '${{ github.event_name }}'; only schedule and workflow_dispatch are allowed."
          exit 1

  collect:
    # This job runs on the team's own machine (P3685.local), where the upstream
    # sites are reachable. Only trusted events may reach that runner: `schedule`
    # always runs the default branch's workflow, and `workflow_dispatch`
    # requires write access. The condition is evaluated before a runner is
    # assigned, so untrusted code never executes on it.
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: [self-hosted, yieldlens]
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: python-collector/requirements.txt

      - run: pip install -r python-collector/requirements.txt

      - name: Run dividend + fundamentals collector
        working-directory: python-collector
        env:
          # Organization-level shared configuration (inherited by this repo).
          # D1_DATABASE_ID is the org variable name; the collector expects the
          # CLOUDFLARE_* environment names below.
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_D1_DATABASE_ID: ${{ vars.D1_DATABASE_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          # Fixed per-project prefix on the shared D1 database. Keep it in sync
          # with worker/wrangler.toml [vars] TABLE_PREFIX.
          TABLE_PREFIX: "YL"
          COLLECT_MODE: ${{ github.event.inputs.mode || 'daily' }}
          # Only inject the backfill window in backfill mode; an empty value
          # keeps daily runs from logging a misleading "ignores ..." message.
          BACKFILL_PERIODS: ${{ github.event.inputs.mode == 'backfill' && (github.event.inputs.backfill_periods || '20') || '' }}
        run: python collect_dividends.py
